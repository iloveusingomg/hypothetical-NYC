<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Replies</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background: linear-gradient(160deg, #f9f0e1, #ede0c4);
      min-height: 100vh;
      padding: 80px 20px;
      font-family: var(--font-body);
    }

    .reply-page {
      max-width: 700px;
      margin: auto;
    }

    .reply-heading {
      text-align: center;
      margin-bottom: 60px;
    }

    .reply-heading h1 {
      font-family: var(--font-display);
      font-size: 3rem;
      font-style: italic;
      color: var(--ink);
    }

    .reply-heading p {
      color: var(--ink-soft);
      opacity: .7;
      margin-top: 10px;
    }

    .reply-card {
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(200,151,58,.18);
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 24px;

      backdrop-filter: blur(10px);

      box-shadow:
        0 10px 30px rgba(43,31,20,.08);
    }

    .reply-to {
      font-family: var(--font-mono);
      color: var(--gold-dark);
      font-size: .8rem;
      letter-spacing: .15em;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .reply-message {
      color: var(--ink-soft);
      line-height: 1.9;
      font-size: 1.08rem;
    }
  </style>
</head>
<body>

  <div class="reply-page">

    <div class="reply-heading">
      <h1>replies</h1>
      <p>
        Hai
      </p>
    </div>

    <!-- REPLY CARD -->
    <div class="reply-card">

      <div class="reply-message">
        it's basically not a love confession btw, more like a thanks. ik it seems weird so i want to appologize if it makes you uncomfortable.
        18/05/26 20:21
      </div>
    </div>

  </div>

</body>
</html>
